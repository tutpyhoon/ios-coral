name: CORAL full Flame XNU RAM-only device-payload preflight (NO boot.img)
on:
  workflow_dispatch:
  push:
    branches: [coral-flame-port]
    paths:
      - '.github/workflows/coral-flame-ram-payload.yml'
permissions:
  contents: read
  actions: read
jobs:
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39883218082
          name: coral-flame-full-xnu0124-UNTESTED
          path: kernel
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 39712670256
          name: coral-phase11-source-built-hfs-inputs
          path: root
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exactly QEMU-proven kernel and source-built HFS root
        run: |
          (cd kernel && sha256sum -c SHA256SUMS)
          (cd root && sha256sum -c SHA256SUMS)
          test "$(stat -c %s root/flame-root.hfs)" = 16777216
          python3 - <<'PY'
          from pathlib import Path
          x=Path("root/flame-root.hfs").read_bytes()
          for m in (b"CORAL11: PID1 HFS+ root active",
                    b"CORAL11: child exec succeeded",
                    b"CORAL11: child exited status 0"):
              assert m in x
          print("PASS: unchanged Phase11 RAM filesystem and two custom processes")
          PY
      - name: Fetch the exact full Flame payload tools used in passed QEMU
        run: |
          git init -q source
          git -C source fetch -q --depth 1 https://github.com/NWylynko/ios-flame.git 745c4341af86089efb0df851fa8a27fb8face624
          git -C source checkout -q --detach FETCH_HEAD
          python3 coral/prepare_upstream_flame.py source
      - name: Pack Coral ADT, full XNU Mach-O and 16 MiB HFS+ RAM only
        run: |
          python3 source/tools/mkadt.py coral-full-ram.adt --qemu
          python3 source/tools/mkpayload.py \
            kernel/kernel.development.sweet coral-full-ram.adt coral-full-ram.payload \
            --cmdline "debug=0xc serial=3 cpus=1 keepsyms=1 rd=md0 sweetgpu=0 rootrw=0 ufsrw=0 coralqemu=1" \
            --ramdisk root/flame-root.hfs
      - name: Verify packed payload's read-only RAM root, geometry and build inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          kernel=Path("kernel/kernel.development.sweet").read_bytes()
          hfs=Path("root/flame-root.hfs").read_bytes()
          payload=Path("coral-full-ram.payload").read_bytes()
          adt=Path("coral-full-ram.adt").read_bytes()
          assert payload[:8]==b"SWEETXNU"
          assert struct.unpack_from("<Q",payload,0x38)[0]==0xb0000000
          for marker in (b"rd=md0",b"RAMDisk",b"coralqemu=1",
                         b"sweetgpu=0",b"rootrw=0",b"ufsrw=0"):
              assert marker in payload,marker
          for marker in (b"google,coral",b"iPhone10,3"):
              assert marker in adt,marker
          assert b"CORAL11: child exec succeeded" in hfs
          assert b"rd=ufsroot0" not in payload
          out=Path("coral-full-flame-ram-preflight")
          out.mkdir()
          m={"qemu_run":39883467416, "kernel_build_run":39883218082,
             "kernel_sha256":hashlib.sha256(kernel).hexdigest(),
             "hfs_sha256":hashlib.sha256(hfs).hexdigest(),
             "adt_sha256":hashlib.sha256(adt).hexdigest(),
             "payload_sha256":hashlib.sha256(payload).hexdigest(),
             "payload_bytes":len(payload),
             "device":"coral", "ram_only":True,"uses_emulator_adt":True,
             "device_flashable":False,"hardware_carveouts_validated":False,
             "status":"QEMU-compatible assembled payload only; NOT a phone boot image"}
          (out/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          (out/"README.txt").write_text(
              "Full Coral XNU + HFS+ source-built test userspace, QEMU only.\n"
              "NO Android boot.img; do NOT fastboot boot/flash this payload.\n"
              "QEMU ADT and emulator-only coralqemu=1 bootarg are not physical Coral settings.\n")
          print("PASS: validated QEMU-compatible raw XNU+HFS engineering payload")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coral-full-flame-ram-payload-PREFLIGHT-ONLY
          path: coral-full-flame-ram-preflight/
          retention-days: 14
          if-no-files-found: error
