name: CORAL Phase12 optional XNU read-only UFS compilation (NO PHONE IMAGE)
on:
  workflow_dispatch:
  push:
    branches: [coral-phase12-springboard]
    paths:
      - 'coral/ufs_xnu12.py'
      - 'coral/postpatch_ufs12.py'
      - '.github/workflows/coral-xnu-ufs-read12.yml'
permissions:
  contents: read

env:
  FLAME_REV: b91463ab1ef083f81f6c3393593385aa996ceaf0
  DXB_REV: 663906528d1cd5ea8fde7de6f16de73db9511549
  XNU_REV: 1b191cb58250d0705d8a51287127505aa4bc0789

jobs:
  source:
    name: Verify pinned UFS patch selection (no storage or phone access)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch audited source and apply CORAL source profile
        run: |
          git init -q source
          git -C source fetch -q --depth 1 https://github.com/dimasmds/ios-flame.git "$FLAME_REV"
          git -C source checkout -q --detach FETCH_HEAD
          python3 coral/stage05.py prepare source
          python3 coral/ufs_xnu12.py setup source
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"source/flame")
          from stage_kernel import selected_inputs
          patch=[p.name for p in selected_inputs()]
          assert any(s.startswith("0028-sweet-ufs-root-device.patch") for s in patch)
          assert not any(s.startswith("0029-") for s in patch)
          assert not any(s.startswith("0030-") for s in patch)
          assert all(int(s[:4]) <= 28 or int(s[:4])==99
                     for s in patch if s[:4].isdigit())
          print("PASS: only upstream 0028 read-only UFS staged; no root-auth bypass or writes")
          PY

  kernel:
    name: Build optional read-only UFS XNU (host only; NOT bootable)
    needs: source
    runs-on: macos-14
    timeout-minutes: 120
    env:
      MACOS_VERSION: "13.5"
      KERNEL_CONFIG: DEVELOPMENT
      MACHINE_CONFIG: SWEET
    steps:
      - uses: actions/checkout@v4
      - name: Pin Flame reference source + CORAL geometry / UFS opt-in
        run: |
          git init -q source
          git -C source fetch -q --depth 1 https://github.com/dimasmds/ios-flame.git "$FLAME_REV"
          git -C source checkout -q --detach FETCH_HEAD
          python3 coral/stage05.py prepare source
          python3 coral/ufs_xnu12.py setup source
      - name: Pin XNU and build framework, stage only read-only UFS patch
        run: |
          git init -q source/dxb
          git -C source/dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build "$DXB_REV"
          git -C source/dxb checkout -q --detach FETCH_HEAD
          python3 source/flame/stage_kernel.py stage source/dxb
          python3 coral/stage05.py hook source
          python3 coral/ufs_xnu12.py hook source source/dxb
          git init -q source/dxb/xnu
          git -C source/dxb/xnu fetch -q --depth 1 https://github.com/apple-oss-distributions/xnu "$XNU_REV"
          git -C source/dxb/xnu checkout -q --detach FETCH_HEAD
      - name: Configure pinned macOS Xcode 15 environment
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_15*.app | sort -V | head -1)
          test -n "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build revised CORAL XNU with read-only UFS linked but not boot-activated
        working-directory: source/dxb
        run: bash build.sh
      - name: Verify compiled source shape and kernel Mach-O
        run: |
          python3 source/flame/stage_kernel.py verify source/dxb/xnu
          python3 source/flame/check_kernel.py source/dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          python3 - <<'PY'
          from pathlib import Path
          root=Path("source/dxb/xnu")
          ufs=(root/"bsd/dev/sweet_ufs.c").read_text()
          assert 'SecureDTLookupEntry(NULL, "/sweet-ufs", &node)' in ufs
          assert "Writes are refused." in ufs
          assert "ufs_read_blocks(" in ufs
          assert "ufs_write_blocks" not in ufs
          assert "ufsrw" not in ufs
          assert (root/"iokit/bsddev/IOKitBSDInit.cpp").read_text().count('strcmp(rdBootVar, "ufsroot0")')==1
          patches=list(Path("source/dxb/patches").glob("0[0-9][0-9][0-9]-*.patch"))
          assert not any(29<=int(p.name[:4])<99 for p in patches)
          print("PASS: XNU read-only driver compiled and disabled unless explicitly requested")
          PY
      - name: Publish kernel for further RAM-only validation (NOT a boot image)
        run: |
          mkdir -p coral-xnu-readonly
          cp source/dxb/fakeroot/System/Library/Kernels/kernel.development.sweet coral-xnu-readonly/
          cp source/dxb/flame-patches.json coral-xnu-readonly/
          (cd coral-xnu-readonly && shasum -a 256 kernel.development.sweet > SHA256SUMS)
          cat > coral-xnu-readonly/README.txt <<'EOF'
          EXPERIMENTAL COMPILATION ONLY: optional read-only UFS, no flashable phone image.
          This is a raw XNU Mach-O kernel, not an Android boot.img.
          UFS opt-in requires rd=ufsroot0 plus compatible /sweet-ufs ADT node.
          Neither opt-in is supplied by the prior working RAM-only boot images.
          There are no writable UFS source patches and no Apple iOS userland here.
          Upstream 0028 code is not yet audited/tested for CORAL runtime after XNU VM startup.
          DO NOT FLASH THIS ARTIFACT OR OVERWRITE PHONE PARTITIONS.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: coral-phase12-xnu-ufs-readonly-UNTESTED
          path: coral-xnu-readonly/
          if-no-files-found: error
          retention-days: 14
