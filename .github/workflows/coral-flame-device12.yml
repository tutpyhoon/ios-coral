name: CORAL full Flame XNU physical RAM boot candidate (TEMPORARY ONLY)
on:
  workflow_dispatch:
  push:
    branches: [coral-flame-port]
    paths:
      - 'coral/build_flame_device12.py'
      - '.github/workflows/coral-flame-device12.yml'
permissions:
  contents: read
  actions: read
jobs:
  boot_package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm lz4 python3 python3-cryptography
      - name: Wait for the matching UFS-diagnostic XNU kernel build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            status=$(gh api repos/tutpyhoon/ios-coral/actions/runs/39891582692 --jq '.status+" "+(.conclusion // "pending")')
            echo "Full diagnostic XNU compile: $status"
            if [ "$status" = "completed success" ]; then break; fi
            if echo "$status" | grep -q '^completed '; then
              echo "STOP: prerequisite diagnostic kernel compilation failed"
              exit 1
            fi
            if [ "$i" = 90 ]; then echo "STOP: prerequisite kernel compile timeout"; exit 1; fi
            sleep 12
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 39891582692
          name: coral-flame-full-xnu0124-UNTESTED
          path: full-kernel
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 39712670256
          name: coral-phase11-source-built-hfs-inputs
          path: hfs
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 39712670256
          name: coral-phase11-child-exec-UNTESTED
          path: known-boot
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check exact boot-source and root checksums
        run: |
          (cd full-kernel && sha256sum -c SHA256SUMS)
          (cd hfs && sha256sum -c SHA256SUMS)
          (cd known-boot && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected="3eba87e4b4a946f8a716bda809c7540759a53943130ae52069933a41b57cacd4"
          b=Path("known-boot/coral-phase11-child-exec-UNTESTED.img").read_bytes()
          assert hashlib.sha256(b).hexdigest()==expected
          assert len(b)==67108864
          print("PASS: boot container exactly matches photographed Phase 11 physical pass")
          PY
      - name: Fetch exact full Flame source and adapt only CORAL shim + ADT
        run: |
          git init -q source
          git -C source fetch -q --depth 1 https://github.com/NWylynko/ios-flame.git 745c4341af86089efb0df851fa8a27fb8face624
          git -C source checkout -q --detach FETCH_HEAD
          python3 coral/prepare_upstream_flame.py source
          python3 coral/port_flame_shim.py source
      - name: Fetch pinned AOSP boot tools, NOT Google/Apple private device files
        run: |
          git init -q input-tools
          git -C input-tools fetch -q --depth 1 https://github.com/dimasmds/ios-flame.git b91463ab1ef083f81f6c3393593385aa996ceaf0
          git -C input-tools checkout -q --detach FETCH_HEAD
          python3 input-tools/flame/fetch.py
          mkdir -p input-tools/downloads/mkbootimg input-tools/downloads/avb
          cp input-tools/research/flame-sources/mkbootimg.py input-tools/downloads/mkbootimg/mkbootimg.py
          mkdir -p input-tools/downloads/mkbootimg/gki
          cp input-tools/research/flame-sources/gki/generate_gki_certificate.py input-tools/downloads/mkbootimg/gki/
          cp input-tools/research/flame-sources/avbtool.py input-tools/downloads/avb/avbtool.py
      - name: Package AArch64 Coral full XNU with source-built RAM root
        run: |
          mkdir -p coral-full-candidate
          python3 coral/build_flame_device12.py \
            --source source \
            --tools input-tools \
            --kernel full-kernel/kernel.development.sweet \
            --ramroot hfs/flame-root.hfs \
            --reference-boot known-boot/coral-phase11-child-exec-UNTESTED.img \
            --output coral-full-candidate/coral-full-flame-RAM-UNTESTED.img
      - name: Audit exact Android boot header, unchanged DTB, and storage-free kernel
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("coral-full-candidate/coral-full-flame-RAM-UNTESTED-engineering/manifest.json").read_text())
          assert j["only_fastboot_boot_supported"] is True
          assert j["never_flash_or_erase"] is True
          assert j["ios_springboard"] is False
          assert j["apple_launchd"] is False
          assert j["hfs_sha256"]
          assert j["dtb_sha256"]=="f582348d19807e8f4681e6c226c9947ef64a380ef1c85c487458f7bf085b89da"
          assert j["ram"]=={"dram_base":"0x100000000","dram_size":"0x40000000",
                              "fb_phys":"0x9c400000","fb_width":1440,
                              "fb_height":3040,"fb_stride":5760}
          print("PASS: full XNU with pinned prior on-device DTB, 1GiB highmem candidate and RAM-only root")
          PY
          (cd coral-full-candidate && sha256sum -c coral-full-flame-RAM-UNTESTED-engineering/SHA256SUMS) || {
            (cd coral-full-candidate && sha256sum coral-full-flame-RAM-UNTESTED.img)
            exit 1
          }
      - name: Prepare read-only UFS-root boot candidate (NOT physically tested)
        run: |
          python3 coral/build_flame_device12.py \
            --source source \
            --tools input-tools \
            --kernel full-kernel/kernel.development.sweet \
            --ramroot hfs/flame-root.hfs \
            --reference-boot known-boot/coral-phase11-child-exec-UNTESTED.img \
            --root-mode ufs \
            --output coral-full-candidate/coral-full-flame-UFS-UNTESTED.img
      - name: Verify read-only UFS root is distinct and dependent on phone installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("coral-full-candidate/coral-full-flame-UFS-UNTESTED-engineering/manifest.json")
          j=json.loads(p.read_text())
          assert j["root_mode"]=="ufs"
          assert j["userdata_must_be_installed_first"]
          assert j["ufs_media_write_commands_enabled"] is False
          assert j["kernel_has_three_ufs_write_fences"] is True
          assert j["apple_launchd"] is False and j["tested_with_apple_launchd"] is False
          assert j["dtb_sha256"]=="f582348d19807e8f4681e6c226c9947ef64a380ef1c85c487458f7bf085b89da"
          assert j["never_flash_or_erase"] and j["only_fastboot_boot_supported"]
          assert Path("coral-full-candidate/coral-full-flame-UFS-UNTESTED.img").stat().st_size==67108864
          print("PASS: separate full iOS userdata root candidate built, untested, no phone touched")
          PY
      - name: Build standalone XNU UFS GPT diagnostic with RAM-root PID1 (NO userdata replacement)
        run: |
          python3 coral/build_flame_device12.py \
            --source source \
            --tools input-tools \
            --kernel full-kernel/kernel.development.sweet \
            --ramroot hfs/flame-root.hfs \
            --reference-boot known-boot/coral-phase11-child-exec-UNTESTED.img \
            --root-mode ufsdiag \
            --output coral-full-candidate/coral-full-flame-UFS-GPT-DIAG-UNTESTED.img
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("coral-full-candidate/coral-full-flame-UFS-GPT-DIAG-UNTESTED-engineering/manifest.json").read_text())
          assert m["root_mode"]=="ufsdiag" and m["coralufsdiag"] is True
          assert m["ufs_media_write_commands_enabled"] is False
          assert m["hfs_sha256"] and not m["userdata_must_be_installed_first"]
          assert m["dtb_sha256"]=="f582348d19807e8f4681e6c226c9947ef64a380ef1c85c487458f7bf085b89da"
          kernel=Path("full-kernel/kernel.development.sweet").read_bytes()
          assert b"CORAL UFS DIAG: GPT userdata" in kernel, "wrong older kernel; no read-only diagnostic"
          print("PASS: opt-in read-only XNU GPT probe, root stays source-built md0")
          PY
      - name: Stage separate temporary XNU GPT probe artifact
        run: |
          mkdir -p coral-ufs-diag
          cp coral-full-candidate/coral-full-flame-UFS-GPT-DIAG-UNTESTED.img coral-ufs-diag/
          cp coral-full-candidate/coral-full-flame-UFS-GPT-DIAG-UNTESTED-engineering/manifest.json coral-ufs-diag/manifest.json
          cat > coral-ufs-diag/README.txt <<'EOF'
          EXPERIMENTAL FULL XNU KERNEL UFS-GPT READ-ONLY DIAGNOSTIC, PIXEL 4 XL
          rd=md0, rootrw=0, ufsrw=0, coralufsdiag=1, sweetgpu=0.
          Initializes the FULL upstream XNU UFS driver and reads physical GPT,
          logs 'CORAL UFS DIAG: GPT userdata FOUND rc=0' if it succeeds,
          then proceeds with the source-built 16MiB HFS+ RAM root.
          NO userdata replacement required. NO SCSI write command can be submitted.
          It DOES program host-controller registers and requests DMA, and may hang or
          destabilize the phone. ONLY temporary fastboot boot. NEVER flash.
          This is not SpringBoard and is NOT hardware tested.
          EOF
          (cd coral-ufs-diag && sha256sum coral-full-flame-UFS-GPT-DIAG-UNTESTED.img > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: coral-full-flame-UFS-GPT-DIAG-UNTESTED
          path: coral-ufs-diag/
          retention-days: 14
          if-no-files-found: error
      - name: Package this experimental image only, not firmware or phone-partition tool
        run: |
          cp coral-full-candidate/coral-full-flame-RAM-UNTESTED-engineering/manifest.json coral-full-candidate/manifest.json
          cat > coral-full-candidate/README.txt <<'EOF'
          CORAL FULL FLAME XNU + RAM HFS TEST, EXPERIMENTAL PHYSICAL DEVICE CANDIDATE
          Pixel 4 XL (coral) ONLY. NOT YET HARDWARE TESTED.
          This does NOT contain Apple launchd, dyld or SpringBoard.
          Full XNU based on Flame patch series 0124, with Adreno output disabled.
          md0 RAM root, rootrw=0, ufsrw=0, sweetgpu=0; no user partition touched.
          Boot only by temporary fastboot boot after backup/product and checksum checks.
          NEVER flash this boot image to boot_a, boot_b or any other partition.
          Device could hang/panic; no automatic Android restart guarantee.
          Underlying DTB is from the prior photographed Phase11 working boot image.
          1GiB high-memory span inferred from prior Coral probe, not full carveout certified.
          EOF
          (cd coral-full-candidate && sha256sum coral-full-flame-RAM-UNTESTED.img > SHA256SUMS)
      - name: Stage UFS-root boot variant and clearly mark physical risk
        run: |
          mkdir -p coral-ufs-boot
          cp coral-full-candidate/coral-full-flame-UFS-UNTESTED.img coral-ufs-boot/
          cp coral-full-candidate/coral-full-flame-UFS-UNTESTED-engineering/manifest.json coral-ufs-boot/manifest.json
          cat > coral-ufs-boot/README.txt <<'EOF'
          PIXEL 4 XL EXPERIMENTAL REAL iOS 16 USERDATA ROOT BOOT — NOT HARDWARE TESTED.
          NOT a current iOS home-screen success. The UFS write path is HARD-FENCED
          in the compiled XNU regardless of boot arguments (rootrw=0, ufsrw=0).
          Only use after the real iOS HFS+ userdata partition has been installed
          with explicit permission and backups. Apple launchd may require root writes.
          Early framebuffer/GPU full iOS 16 path remains unverified on Coral.
          There are NO Apple system files in this image; those live on the private HFS+ root.
          NEVER fastboot flash any boot partitions; fastboot boot only for deliberate tests.
          Can hang, reboot or cause persistent data loss by writing userdata. Use at your own risk.
          EOF
          (cd coral-ufs-boot && sha256sum coral-full-flame-UFS-UNTESTED.img > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: coral-full-flame-UFS-UNTESTED
          path: coral-ufs-boot/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coral-full-flame-RAM-UNTESTED
          path: |
            coral-full-candidate/coral-full-flame-RAM-UNTESTED.img
            coral-full-candidate/SHA256SUMS
            coral-full-candidate/manifest.json
            coral-full-candidate/README.txt
          retention-days: 14
          if-no-files-found: error
